<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>免费视频压缩工具</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="container">

    <h1>🎬免费视频压缩工具</h1>

    <p>
        上传视频 →
        Render服务器 →
        FFmpeg压缩 →
        下载压缩后视频
    </p>

    <br>

    <input
        type="file"
        id="videoFile"
        accept="video/*">

    <br><br>

    <button id="compressBtn">
        开始压缩
    </button>

    <br><br>

    <div id="status">

        请选择视频文件

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
