<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>免费视频压缩工具</title>
</head>

<body>

<h1>🎬 免费视频压缩工具</h1>

<input type="file" id="videoInput">

<br><br>

<button id="compressBtn">
开始压缩
</button>

<br><br>

<div id="status"></div>

<script type="module">

import { FFmpeg }
from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';

const ffmpeg = new FFmpeg();

document
.getElementById("compressBtn")
.addEventListener("click", async () => {

    const file =
        document.getElementById("videoInput")
        .files[0];

    if(!file){
        alert("请选择视频");
        return;
    }

    document.getElementById("status")
    .innerHTML = "正在加载FFmpeg...";

    await ffmpeg.load();

    document.getElementById("status")
    .innerHTML = "FFmpeg加载成功";

});

</script>

</body>

</html>
